name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS because the Swift helper only builds here. The contract specs that need a
    # real Mac are not part of this run: a hosted runner cannot grant the permissions
    # they need, so they stay on a maintainer's Mac (plan.md, "Three kinds of spec").
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Spec
        run: npm run spec
